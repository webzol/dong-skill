<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WXSkill · 选择模板与主题</title>
<style>
  :root{--bg:#0c0e13;--panel:#14161d;--panel2:#1a1d26;--line:#262a35;--txt:#e7ebf3;--mut:#8b93a7;--acc:#615ced;--acc2:#22d3ee;--gold:#f5a623;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

  header{padding:16px 24px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:15px;font-weight:700;letter-spacing:.3px;}
  header .sub{font-size:12px;color:var(--mut);margin-top:2px;}

  .layout{display:flex;flex:1;overflow:hidden;}

  /* ── Panel ── */
  .panel{width:260px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
  .panel-title{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;padding:14px 18px 8px;flex-shrink:0;}
  .panel-list{flex:1;overflow-y:auto;padding:4px 10px 16px;}
  .panel-list::-webkit-scrollbar{width:4px;}
  .panel-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}

  /* ── Option rows ── */
  .opt{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:2px;}
  .opt:hover{background:var(--panel2);}
  .opt.active{background:rgba(97,92,237,.12);border:1px solid rgba(97,92,237,.3);}
  .opt .radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .opt.active .radio{border-color:var(--acc);background:var(--acc);}
  .opt.active .radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;}
  .opt .icon{width:32px;height:32px;border-radius:6px;overflow:hidden;flex-shrink:0;border:1px solid var(--line);}
  .opt .info{flex:1;min-width:0;}
  .opt .info .name{font-size:13px;font-weight:600;color:var(--txt);}
  .opt .info .desc{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .opt .badge{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700;flex-shrink:0;}
  .badge-default{background:rgba(97,92,237,.2);color:var(--acc2);}
  .badge-rec{background:var(--gold);color:#000;}

  /* ── Right preview ── */
  .right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0a0c10;}
  .preview-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;cursor:zoom-in;position:relative;}
  .preview-wrap:hover{background:rgba(97,92,237,.03);}
  .preview-frame{width:677px;transform-origin:top left;transform:scale(.42);border-radius:4px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5);transition:transform .2s;}
  .preview-wrap:hover .preview-frame{transform:scale(.44);}
  .preview-frame .art{width:238%;}
  .preview-zoom-hint{position:absolute;bottom:12px;right:16px;font-size:11px;color:var(--mut);background:rgba(20,22,29,.85);padding:4px 10px;border-radius:6px;border:1px solid var(--line);pointer-events:none;}
  .preview-label{padding:12px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);text-align:center;flex-shrink:0;background:var(--panel);}
  .preview-label strong{color:var(--acc2);}

  /* ── Zoom modal ── */
  .zoom-overlay{position:fixed;inset:0;background:rgba(6,8,12,.92);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out;backdrop-filter:blur(8px);}
  .zoom-overlay.open{display:flex;}
  .zoom-inner{width:677px;max-height:90vh;overflow-y:auto;border-radius:6px;box-shadow:0 32px 80px rgba(0,0,0,.7);}
  .zoom-inner::-webkit-scrollbar{width:6px;}
  .zoom-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
  .zoom-inner .art{width:100%;}
  .zoom-hint{position:absolute;top:16px;right:24px;font-size:11px;color:rgba(255,255,255,.4);pointer-events:none;}

  /* ── Footer ── */
  footer{padding:12px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:linear-gradient(180deg,#14161d,#101219);}
  .btn-recommend{background:transparent;color:var(--gold);border:1px solid rgba(245,166,35,.4);padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s;margin-right:10px;}
  .btn-recommend:hover{background:rgba(245,166,35,.1);}
  .btn-apply{background:var(--acc);color:#fff;border:none;padding:8px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn-apply:hover{opacity:.88;}
  .hint{font-size:12px;color:var(--mut);}

  /* ── Confirm Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,8,12,.8);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 32px 24px;max-width:400px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,.55);}
  .modal-box h2{margin:0 0 4px;font-size:16px;font-weight:700;}
  .modal-box .modal-sub{font-size:12px;color:var(--mut);margin:0 0 20px;}
  .combo-block{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
  .combo-block .row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
  .combo-block .lbl{color:var(--mut);font-size:12px;}
  .combo-block .val{font-weight:700;color:var(--txt);font-size:14px;}
  .copy-row{display:flex;gap:8px;margin-bottom:16px;}
  .copy-input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px;padding:8px 12px;outline:none;font-family:monospace;}
  .copy-input:focus{border-color:var(--acc);}
  .btn-copy{background:var(--acc);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s;}
  .btn-copy:hover{opacity:.85;}
  .btn-copy.copied{background:#16a34a;}
  .btn-done{width:100%;background:transparent;border:1px solid var(--line);color:var(--txt);padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn-done:hover{border-color:var(--acc2);color:var(--acc2);}
</style>
</head>
<body>

<header>
  <div>
    <h1>WXSkill · 选择排版组合</h1>
    <p class="sub">选择一个模板 + 一个主题，预览右侧实时生效（点击预览可放大查看）</p>
  </div>
</header>

<div class="layout">
  <!-- Template panel -->
  <div class="panel">
    <div class="panel-title">模板</div>
    <div class="panel-list" id="tmplList"></div>
  </div>

  <!-- Theme panel -->
  <div class="panel" style="border-right:none;border-left:1px solid var(--line);">
    <div class="panel-title">主题色调</div>
    <div class="panel-list" id="themeList"></div>
  </div>

  <!-- Preview -->
  <div class="right">
    <div class="preview-wrap" id="previewWrap" onclick="openZoom()">
      <div class="preview-frame">
        <div id="previewArt"></div>
      </div>
      <span class="preview-zoom-hint">点击放大查看</span>
    </div>
    <div class="preview-label" id="previewLabel">请选择模板与主题</div>
  </div>
</div>

<footer>
  <div style="display:flex;align-items:center;">
    <button class="btn-recommend" onclick="pickRecommend()">★ 排版推荐：简约科技 × DONGPro</button>
    <span class="hint">点击选项切换 · 点击预览放大</span>
  </div>
  <button class="btn-apply" onclick="applySelection()">确认使用此组合</button>
</footer>

<!-- Zoom overlay -->
<div id="zoomOverlay" class="zoom-overlay" onclick="closeZoom()">
  <span class="zoom-hint">点击任意处关闭</span>
  <div class="zoom-inner" id="zoomInner" onclick="event.stopPropagation()"></div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h2>✓ 组合已选定</h2>
    <p class="modal-sub">请将以下内容发给 AI，它将根据此模板 + 主题生成排版。</p>
    <div class="combo-block">
      <div class="row"><span class="lbl">模板</span><span class="val" id="mVal"></span></div>
      <div class="row"><span class="lbl">主题</span><span class="val" id="tVal"></span></div>
      <div class="row"><span class="lbl">组合代码</span><span class="val" id="codeVal" style="color:var(--acc2);font-family:monospace;font-size:13px;"></span></div>
    </div>
    <div class="copy-row">
      <input class="copy-input" id="copyInput" readonly>
      <button class="btn-copy" id="copyBtn" onclick="copyCombo()">复制</button>
    </div>
    <button class="btn-done" onclick="closeModal()">完成，关闭此页</button>
  </div>
</div>

<script>
const THEMES={
  "minimal-light":{label:"极简白",c:{bg:"#ffffff",text:"#1c1c1e",muted:"#8e8e93",accent:"#111111",accent2:"#7c8797",cardBg:"#f5f6f8",cardBorder:"#e3e6ec",divider:"#ececf0",codeBg:"#f2f3f5",codeText:"#44484d",titleBar:"#111111",quoteBorder:"#d0d3dc"}},
  "minimal-dark": {label:"极简黑",c:{bg:"#0e0e10",text:"#ececee",muted:"#9a9aa2",accent:"#ffffff",accent2:"#b3b9c4",cardBg:"#1a1b1e",cardBorder:"#2a2b30",divider:"#26272c",codeBg:"#16171a",codeText:"#9aa4b2",titleBar:"#ffffff",quoteBorder:"#3a3b40"}},
  "tech-blue":    {label:"科技蓝",c:{bg:"#0b1220",text:"#e6edf7",muted:"#8b98ad",accent:"#3b82f6",accent2:"#22d3ee",cardBg:"#101b30",cardBorder:"#1f2d4a",divider:"#1c2942",codeBg:"#0d1626",codeText:"#7dd3fc",titleBar:"#3b82f6",quoteBorder:"#22d3ee"}},
  "cyber-green":  {label:"赛博绿",c:{bg:"#0a0f0c",text:"#d9ffe9",muted:"#6fa088",accent:"#00ff9c",accent2:"#7cf5c0",cardBg:"#0e1712",cardBorder:"#16331f",divider:"#143522",codeBg:"#07120c",codeText:"#62ffb0",titleBar:"#00ff9c",quoteBorder:"#00ff9c"}},
  "neon-purple":  {label:"霓虹紫",c:{bg:"#0e0b1a",text:"#f0eaff",muted:"#9a8fc4",accent:"#a855f7",accent2:"#e14eca",cardBg:"#161130",cardBorder:"#2a1f4d",divider:"#241a44",codeBg:"#120d24",codeText:"#c084fc",titleBar:"#a855f7",quoteBorder:"#e14eca"}},
  "taobao-flash": {label:"淘宝闪购",c:{bg:"#ffffff",text:"#141414",muted:"#8c8c8c",accent:"#408bfb",accent2:"#ff6827",cardBg:"#f4f0ff",cardBorder:"#e8e8ef",divider:"#ececec",codeBg:"#f5f6f8",codeText:"#408bfb",titleBar:"#408bfb",quoteBorder:"#ff6827"}},
  "wechat-pai":   {label:"微信派",c:{bg:"#ffffff",text:"#4d4d4d",muted:"#888888",accent:"#07c160",accent2:"#1c53d6",cardBg:"#f7f7f7",cardBorder:"#ededf0",divider:"#efefef",codeBg:"#f4f4f4",codeText:"#07c160",titleBar:"#07c160",quoteBorder:"#07c160"}},
  "dongpro":      {label:"DONGPro极简科技 · 排版推荐",rec:true,c:{bg:"#ffffff",text:"#141414",muted:"#8a8a8a",accent:"#141414",accent2:"#615ced",cardBg:"#f7f7f7",cardBorder:"#ececec",divider:"#efefef",codeBg:"#f4f4f5",codeText:"#615ced",titleBar:"#141414",quoteBorder:"#141414"}}
};
const TEMPLATES=["minimal-tech","cyber-card","terminal-code","hud","wechat-pai-essay"];
const TLABEL={"minimal-tech":"简约科技","cyber-card":"卡片风","terminal-code":"终端风","hud":"数据面板","wechat-pai-essay":"微信派长文"};
const TDESC={"minimal-tech":"细标题线 + 大留白 + 干净信息流","cyber-card":"圆角卡片分隔块，最有产品感","terminal-code":"等宽标题 + 命令符引导","hud":"数据面板 · KPI 大字 + 迷你条","wechat-pai-essay":"文艺长文 · PingFang + 两端对齐"};

const DEFAULT_TMPL="minimal-tech";
const DEFAULT_THEME="dongpro";

let activeTmpl=DEFAULT_TMPL;
let activeTheme=DEFAULT_THEME;
let currentZoomArt='';

/* ── SVG icons ── */
function tmplIcon(key){
  const icons={
    "minimal-tech":'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect fill="#111" width="32" height="32" rx="4"/><line x1="6" y1="10" x2="26" y2="10" stroke="#615ced" stroke-width="2"/><rect x="6" y="14" width="20" height="1.5" fill="#444" rx=".5"/><rect x="6" y="18" width="16" height="1.5" fill="#444" rx=".5"/><rect x="6" y="22" width="18" height="1.5" fill="#444" rx=".5"/></svg>',
    "cyber-card":'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect fill="#111" width="32" height="32" rx="4"/><rect x="5" y="7" width="22" height="9" fill="#615ced" rx="2" opacity=".7"/><rect x="5" y="18" width="10" height="7" fill="#444" rx="2"/><rect x="17" y="18" width="10" height="7" fill="#444" rx="2"/></svg>',
    "terminal-code":'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect fill="#0a0a0a" width="32" height="32" rx="4"/><text x="6" y="12" fill="#00ff9c" font-size="6" font-family="monospace">&gt;</text><rect x="6" y="16" width="18" height="1.5" fill="#444" rx=".5"/><rect x="6" y="20" width="14" height="1.5" fill="#444" rx=".5"/><rect x="6" y="24" width="10" height="1.5" fill="#444" rx=".5"/></svg>',
    "hud":'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect fill="#111" width="32" height="32" rx="4"/><circle cx="10" cy="11" r="4" fill="#615ced" opacity=".8"/><text x="7" y="13" fill="#fff" font-size="4" font-weight="bold">1.1</text><rect x="5" y="20" width="22" height="2" fill="#333" rx="1"/><rect x="5" y="24" width="14" height="2" fill="#615ced" rx="1"/></svg>',

  };
  return icons[key]||'';
}

/* ── 长内容预览 HTML ── */
function tMinimal(c){
  return `<section style="max-width:677px;background:${c.bg};color:${c.text};padding:28px 22px;">
    <h1 style="margin:0 0 8px;font-size:26px;line-height:1.3;font-weight:700;letter-spacing:1px;">产品周报 · 第 12 期</h1>
    <p style="margin:0 0 22px;font-size:13px;color:${c.muted};letter-spacing:.5px;">用科技感排版，3 分钟搞定一篇公众号文章</p>
    <section style="height:1px;background:${c.divider};margin:0 0 28px;"></section>

    <p style="margin:0 0 10px;border-left:3px solid ${c.accent};padding-left:10px;font-size:14px;line-height:1.7;color:${c.text};">首屏体积 −62%，核心包由 2.1MB 压缩至 780KB</p>
    <p style="margin:0 0 10px;border-left:3px solid ${c.divider};padding-left:10px;font-size:14px;line-height:1.7;color:${c.text};">可交互时间 TTI −58%，让用户提前感知页面可用</p>
    <p style="margin:0 0 20px;border-left:3px solid ${c.divider};padding-left:10px;font-size:14px;line-height:1.7;color:${c.text};">LCP 降至 1.4s，排名进入 Google Core Web Vitals 绿色区间</p>
    <section style="margin:24px 0;padding:16px 18px;background:${c.cardBg};border-left:4px solid ${c.quoteBorder};border-radius:8px;"><p style="margin:0;font-size:15px;line-height:1.7;color:${c.text};">慢的地方不在网络，而在没拆分。代码分割策略是性能优化的核心杠杆。</p></section>
    <section style="border-left:4px solid ${c.accent};padding-left:10px;font-size:18px;font-weight:700;color:${c.text};margin:30px 0 16px;line-height:1.4;">下周规划</section>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.8;color:${c.text};">接下来将推进 SSR 预渲染落地，预计再降 300ms 首屏耗时。同时开始 AB 测试新设计系统对转化率的影响。</p>
    <section style="margin-top:36px;padding-top:18px;border-top:1px solid ${c.divider};"><p style="margin:0;font-size:12px;color:${c.muted};letter-spacing:.5px;text-align:center;">欢迎留言交流 · 下期见</p></section>
  </section>`;
}
function tCard(c){
  return `<section style="max-width:677px;background:${c.bg};color:${c.text};padding:24px 18px;">
    <section style="background:${c.cardBg};border:1px solid ${c.cardBorder};border-radius:12px;padding:22px 20px;">
      <p style="margin:0 0 6px;font-size:12px;letter-spacing:2px;color:${c.accent};">WEEKLY REPORT</p>
      <h1 style="margin:0;font-size:24px;line-height:1.3;font-weight:700;color:${c.text};">产品周报 · 第 12 期</h1>

    </section>

      <td width="50%" valign="top" style="padding-left:8px;"><section style="background:${c.cardBg};border:1px solid ${c.cardBorder};border-radius:10px;padding:16px 12px;"><p style="margin:0;font-weight:700;color:${c.text};">TTI</p><p style="margin:6px 0 0;font-size:22px;font-weight:800;color:${c.accent};">−58%</p><p style="margin:4px 0 0;font-size:12px;color:${c.muted};">3.2s → 1.35s</p></section></td>
    </tr></table>
    <section style="background:${c.cardBg};border:1px solid ${c.cardBorder};border-radius:10px;padding:14px;margin:12px 0;"><p style="margin:0;font-size:14px;line-height:1.7;color:${c.text};">核心优化手段包括：代码分割、懒加载资源、DNS 预解析、以及关键请求优先级调整。</p></section>
    <section style="margin-top:28px;padding-top:16px;border-top:1px solid ${c.cardBorder};"><p style="margin:0;font-size:12px;color:${c.muted};text-align:center;">关注我们 · 每周递送产品洞察</p></section>
  </section>`;
}
function tTerminal(c){
  const mono="font-family:'Menlo','Consolas','Courier New',monospace;";
  return `<section style="max-width:677px;background:${c.bg};color:${c.text};padding:24px 18px;${mono}">

const RENDER={"minimal-tech":tMinimal,"cyber-card":tCard,"terminal-code":tTerminal,"hud":tHud,"wechat-pai-essay":tEssay};

/* ── Render panels ── */
function renderTmplList(){
  const el=document.getElementById("tmplList");
  el.innerHTML="";
  TEMPLATES.forEach(k=>{
    const div=document.createElement("div");
    div.className="opt"+(k===activeTmpl?" active":"");
    div.innerHTML=`
      <div class="radio"></div>
      <div class="icon">${tmplIcon(k)}</div>
      <div class="info"><div class="name">${TLABEL[k]}</div><div class="desc">${TDESC[k]}</div></div>
      ${k===DEFAULT_TMPL?'<span class="badge badge-default">默认</span>':''}
    `;
    div.onclick=()=>{activeTmpl=k;renderAll();};
    el.appendChild(div);
  });
}

function renderThemeList(){
  const el=document.getElementById("themeList");
  el.innerHTML="";
  for(const k in THEMES){
    const th=THEMES[k];
    const c=th.c;
    const div=document.createElement("div");
    div.className="opt"+(k===activeTheme?" active":"");
    div.innerHTML=`
      <div class="radio"></div>
      <div style="width:28px;height:28px;border-radius:6px;background:${c.bg};border:1px solid ${c.cardBorder};flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <div style="width:14px;height:14px;border-radius:50%;background:${c.accent};border:1px solid ${c.cardBorder};"></div>
      </div>
      <div class="info"><div class="name">${th.label}</div><div class="desc" style="color:${c.accent};font-size:10px;font-family:monospace;">${c.bg} / ${c.accent}</div></div>
      ${th.rec?'<span class="badge badge-rec">排版推荐</span>':''}
    `;
    div.onclick=()=>{activeTheme=k;renderAll();};
    el.appendChild(div);
  }
}

function renderPreview(){
  const c=THEMES[activeTheme].c;
  const renderFn=RENDER[activeTmpl];
  const art=renderFn?renderFn(c):'';
  currentZoomArt=art;
  document.getElementById("previewArt").innerHTML=art;
  document.getElementById("previewLabel").innerHTML=
    `当前：<strong>${TLABEL[activeTmpl]}</strong> × <strong>${THEMES[activeTheme].label}</strong>`;
}

/* ── Zoom ── */
function openZoom(){
  if(!currentZoomArt) return;
  document.getElementById("zoomInner").innerHTML=`<div class="art">${currentZoomArt}</div>`;
  document.getElementById("zoomOverlay").classList.add("open");
}
function closeZoom(){
  document.getElementById("zoomOverlay").classList.remove("open");
}

/* ── Modal ── */
function openModal(){
  const themeName=THEMES[activeTheme].label;
  const tmplName=TLABEL[activeTmpl];
  const comboCode=`${tmplName} × ${themeName}（${activeTmpl} / ${activeTheme}）`;
  document.getElementById("mVal").textContent=tmplName;
  document.getElementById("tVal").textContent=themeName;
  document.getElementById("codeVal").textContent=comboCode;
  const input=document.getElementById("copyInput");
  input.value=comboCode;
  input.select();
  const btn=document.getElementById("copyBtn");
  btn.textContent="复制";
  btn.classList.remove("copied");
  document.getElementById("confirmModal").classList.add("open");
}
function closeModal(){document.getElementById("confirmModal").classList.remove("open");}
function copyCombo(){
  const input=document.getElementById("copyInput");
  navigator.clipboard.writeText(input.value).then(()=>{
    const btn=document.getElementById("copyBtn");
    btn.textContent="✓ 已复制";
    btn.classList.add("copied");
  }).catch(()=>document.execCommand("copy"));
}
function applySelection(){openModal();}
function pickRecommend(){
  activeTmpl=DEFAULT_TMPL;
  activeTheme=DEFAULT_THEME;
  renderAll();
  openModal();
}

function renderAll(){
  renderTmplList();
  renderThemeList();
  renderPreview();
}

/* ESC to close zoom or modal */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById("zoomOverlay").classList.contains("open")) closeZoom();
    else if(document.getElementById("confirmModal").classList.contains("open")) closeModal();
  }
});

renderAll();
</script>
