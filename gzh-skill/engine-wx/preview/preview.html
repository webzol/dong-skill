<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WXSkill · 微信排版预览画廊</title>
<style>
  :root{--bg:#0c0e13;--panel:#14161d;--panel2:#1a1d26;--line:#262a35;--txt:#e7ebf3;--mut:#8b93a7;--acc:#3b82f6;--acc2:#22d3ee;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  header{padding:26px 22px 6px;border-bottom:1px solid var(--line);}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;}
  header p{margin:8px 0 0;color:var(--mut);font-size:13px;}
  .controls{padding:16px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;}
  .label{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .pills{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{border:1px solid var(--line);background:var(--panel);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;transition:.15s;}
  .pill:hover{border-color:var(--acc2);color:var(--txt);}
  .pill.active{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
  .grid{padding:20px 22px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.35);border-color:var(--acc2);}
  .meta{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .meta .t{font-weight:700;font-size:13px;}
  .meta .th{font-size:11px;color:var(--mut);}
  .frame{position:relative;height:400px;overflow:hidden;}
  .art{position:absolute;top:0;left:0;width:677px;transform:scale(0.335);transform-origin:top left;}
  .frame::after{content:"点按放大";position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;opacity:0;transition:.15s;}
  .card:hover .frame::after{opacity:1;}
  /* 焦点大图 */
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.8);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
  .modal.open{display:flex;}
  .big{background:transparent;border-radius:12px;overflow:auto;max-width:calc(100% - 32px);}
  .big .bmeta{display:flex;justify-content:space-between;margin-bottom:12px;color:var(--mut);font-size:13px;}
  .big .bmeta b{color:var(--txt);}
  .close{color:var(--txt);background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:8px;cursor:pointer;}
  .foot{padding:18px 22px 34px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<header>
  <h1>WXSkill · 微信排版预览画廊</h1>
  <p>8 个色调 × 5 个模板 = 40 种组合。浏览器所见 ≈ 微信公众号里所见（微信会剥掉 flex/grid，画廊内每张卡片就是这个兼容方案的真实渲染）。</p>
</header>
<div class="controls">
  <span class="label">色调</span>
  <div id="tPills" class="pills"></div>
  <span class="label" style="margin-left:12px;">模板</span>
  <div id="mPills" class="pills"></div>
</div>
<div id="grid" class="grid"></div>
<div class="foot">来源：themes/*.json（色板） · templates/*.md（骨架）。点卡片看大图；改动色值后重开本页即可刷新。</div>

<div id="modal" class="modal"><div class="big"><div class="bmeta"><b id="bmTitle"></b><button class="close" onclick="closeModal()">关闭 ✕</button></div><div id="bmContent"></div></div></div>

  tp.innerHTML = thHtml;
  const mp = document.getElementById("mPills");
  let tmHtml = `<button class="pill ${state.m==="all"?"active":""}" onclick="setM('all')">全部</button>`;
  TEMPLATES.forEach(k=>{ tmHtml += `<button class="pill ${state.m===k?"active":""}" onclick="setM('${k}')">${TLABEL[k]}</button>`; });
  mp.innerHTML = tmHtml;
}
function draw(){
  buildOptions();
  let html = "";
  const tKeys = state.t==="all"? Object.keys(THEMES) : [state.t];
  const mKeys = state.m==="all"? TEMPLATES : [state.m];
  tKeys.forEach(t=>{ mKeys.forEach(m=>{
    const c = THEMES[t].c;
    const art = RENDER[m](c);
    html += `<div class="card" onclick="focus('${t}','${m}')">
      <div class="meta"><span class="t">${TLABEL[m]}</span><span class="th">${THEMES[t].label} · ${t}</span></div>
      <div class="frame"><div class="art">${art}</div></div>
    </div>`;
  });});
  grid.innerHTML = html;
}
function setT(v){ state.t=v; draw(); }
function setM(v){ state.m=v; draw(); }
function focus(t,m){
  const c = THEMES[t].c;
  document.getElementById("bmTitle").textContent = `${TLABEL[m]} × ${THEMES[t].label}（${t} / ${m}）`;
  document.getElementById("bmContent").innerHTML = `<div style="max-width:677px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);">${RENDER[m](c)}</div>`;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
draw();
</script>
</body>
</html>
